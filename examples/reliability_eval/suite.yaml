name: reliability-smoke
description: An API-free suite where one case passes every time and one passes only sometimes. Run with --repeat 3.
version: "1.0"
model: mock-local
provider: mock
stages:
  - deterministic
fail_fast: false
thresholds:
  deterministic_pass_rate: 1.0
  persona_min_score: 3.5
  judge_min_score: 3.5
  regression_tolerance: 0.05
cases:
  - cases/steady.yaml
  - cases/flaky.yaml
