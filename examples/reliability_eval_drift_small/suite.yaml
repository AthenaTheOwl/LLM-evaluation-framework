name: reliability-smoke
description: Same suite name as reliability_eval so it compares against that baseline; deterministic gate relaxed so the comparison decides the exit code.
version: "1.0"
model: mock-local
provider: mock
stages:
  - deterministic
fail_fast: false
thresholds:
  deterministic_pass_rate: 0.0
  persona_min_score: 3.5
  judge_min_score: 3.5
  regression_tolerance: 0.05
cases:
  - cases/steady.yaml
  - cases/flaky.yaml
